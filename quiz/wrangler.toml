# Quiz site: static page + API on one Worker. Deploy only after the founder's OK (name and domain not decided yet).
name = "which-one-is-real"
main = "src/worker.js"
compatibility_date = "2026-07-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "which-one-is-real"
database_id = "00000000-0000-0000-0000-000000000000" # replaced by `wrangler d1 create` before the first deploy
