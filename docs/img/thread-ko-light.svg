<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604" role="img" aria-label="교촌치킨 드시는분?" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="899" height="603" rx="16" fill="#fcfcfb" stroke="#e4e3de"/>
<text x="32" y="44" font-size="13" font-weight="600" fill="#52514e">클리앙 모두의공원</text>
<text x="32" y="72" font-size="21" font-weight="700" fill="#0b0b0b">교촌치킨 드시는분?</text>
<line x1="32" y1="100" x2="868" y2="100" stroke="#e4e3de"/>
<circle cx="50" cy="130" r="16" fill="#c4c3bd"/>
<text x="84" y="135" font-size="15" font-weight="700" fill="#0b0b0b">그냥 Claude</text>
<rect x="802.8" y="116" width="65.19999999999999" height="28" rx="14" fill="#f0efec"/>
<text x="835.4" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">사람 11%</text>
<text x="84" y="162" font-size="15" fill="#0b0b0b">교촌은 취향이 갈리는 거지 맛이 없는 건 아니라고 생각해요. 저도 간장 오리지날은 가끔 생각나서</text>
<text x="84" y="185" font-size="15" fill="#0b0b0b">시킵니다. 짭짤달달한 맛이 다른 데서 잘 안 나오더라고요.</text>
<text x="84" y="218" font-size="15" fill="#0b0b0b">다만 미운털 박힌 이유는 맛보다는 가격 쪽이 큰 것 같아요.</text>
<text x="84" y="241" font-size="13" fill="#8a8984">+ 두 문단 더</text>
<line x1="32" y1="280" x2="868" y2="280" stroke="#e4e3de"/>
<circle cx="50" cy="310" r="16" fill="#c4c3bd"/>
<text x="84" y="315" font-size="15" font-weight="700" fill="#0b0b0b">im-not-ai(별 6.8천) + 실제 댓글 10개</text>
<rect x="802.8" y="296" width="65.19999999999999" height="28" rx="14" fill="#f0efec"/>
<text x="835.4" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">사람 44%</text>
<text x="84" y="342" font-size="15" fill="#0b0b0b">저도 교촌 먹을 때 양 적다고 느낀 적은 별로 없습니다. 다만 가격이 많이 올라서 그게 좀 아쉽죠.</text>
<text x="84" y="365" font-size="15" fill="#0b0b0b">맛은 허니콤보 같은 건 아직도 괜찮다고 봅니다.</text>
<rect x="12" y="406" width="876" height="114" rx="12" fill="#eaf2fc"/>
<circle cx="50" cy="434" r="16" fill="#2a78d6"/>
<text x="84" y="439" font-size="15" font-weight="700" fill="#0b0b0b">community-humanizer</text>
<rect x="802.8" y="420" width="65.19999999999999" height="28" rx="14" fill="#2a78d6"/>
<text x="835.4" y="439" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">사람 82%</text>
<text x="84" y="466" font-size="15" fill="#0b0b0b">닭이 작은 건 인정인데 가격이 안 작아요 ㅋㅋ</text>
<rect x="84" y="478" width="6" height="6" rx="3" fill="#2a78d6"/><text x="98" y="489" font-size="13" fill="#52514e">GPT는 진짜 공감 1위 댓글보다 이 댓글을 더 사람 같다고 봤어요.</text>
<line x1="32" y1="524" x2="868" y2="524" stroke="#e4e3de"/>
<text x="32" y="550" font-size="13" fill="#52514e">진짜 공감 1위 댓글은 사람 88%였어요. 점수: "사람이 썼을 확률"(0~100), GPT·Claude Opus·Claude Sonnet 블라인드</text>
<text x="32" y="570" font-size="13" fill="#52514e">채점 평균.</text>
</svg>
